<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación SIAMO</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f4f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(21, 152, 169, 0.15);
            overflow: hidden;
        }

        .header {
            background-color: #1598A9;
            color: #ffffff;
            padding: 30px 30px 25px 30px;
            text-align: center;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .content {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
        }

        .content h2 {
            color: #1598A9;
            margin-top: 0;
        }

        .message-box {
            background-color: #e8f7f9;
            border-left: 4px solid #1598A9;
            padding: 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }

        .message-box p {
            margin: 0;
            font-size: 16px;
        }

        .cta-section {
            text-align: center;
            margin: 25px 0;
        }

        .cta-button {
            display: inline-block;
            background-color: #1598A9;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
        }

        .cta-text {
            margin-bottom: 15px;
            color: #555555;
        }

        .footer {
            background-color: #0d7a88;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #ffffff;
        }

        .footer a {
            color: #b8e6ec;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-circle">
                <img src="cid:CARIS_SIMBOLO.png" alt="CARIS Logo">
            </div>
            <h1>Verificación SIAMO</h1>
        </div>
        <div class="content">
            <h2>Hola, {{ nombre }}</h2>

            <div class="message-box">
                <p>{{ mensaje }}</p>
            </div>

            <div class="cta-section">
                <a href="https://web.caris.com.co" class="cta-button">SIAMO</a>
            </div>

            <p>Si tienes alguna pregunta, no dudes en contactarnos.</p>
        </div>
        <div class="footer">
            <p>Este es un correo automático, por favor no responder.</p>
        </div>
    </div>
</body>

</html>
